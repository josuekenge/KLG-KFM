# Netlify Configuration for Kyeto Logistics Group
# Domain: kyetologistics.com & www.kyetologistics.com

[build]
  # Build command - Using next build directly per Netlify best practices
  command = "next build"

[build.environment]
  # Node version - Updated to 20 for compatibility
  NODE_VERSION = "20"
  
  # Next.js specific
  NEXT_TELEMETRY_DISABLED = "1"
  
  # Skip husky installation in CI
  CI = "true"

# Note: HTTP-to-HTTPS and www-to-non-www redirects are handled by Netlify dashboard settings
# Do not add redirect rules here to avoid redirect loops

# Headers for security and performance
# Note: robots.txt and sitemap.xml are handled by Next.js App Router
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    
    # HSTS - Force HTTPS for 2 years
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    
    # Content Security Policy
    # Content-Security-Policy removed to allow CDN scripts

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    # Cache static assets for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    # Cache fonts for 1 year
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

# Plugin configuration
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Note: HTTPS enforcement is handled by Netlify's built-in "Force HTTPS" setting
# Do not add custom edge functions for HTTPS redirection to avoid redirect loops

# Context-specific settings
# Note: Removed NODE_ENV = "production" to allow devDependencies installation

# Dev server settings (for Netlify Dev)
[dev]
  command = "npm run dev"
  port = 3001
  targetPort = 3001
  autoLaunch = false

